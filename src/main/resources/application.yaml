spring:
  application:
    name: SCPAPI

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: true

  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    from: foundation@demomailtrap.co

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  restoration-tokens:
    minutes: 15

  media:
    allowedTypes:
      - image/png
      - image/jpg
      - image/jpeg
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  cloud:
    aws:
      credentials:
        accessKey: ${AWS_ACCESS_KEY}
        secretKey: ${AWS_SECRET_KEY}
        region:
          static: ${AWS_REGION}
    s3:
      bucket: ${AWS_BUCKET:scp-api-media-storage}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_JWK_URI}

  # Client Credentials Grant Type
  keycloak:
    base-url: ${AUTH_SERVER_KEYCLOAK_URL}
    realm: ${AUTH_SERVER_KEYCLOAK_REALM}
    client-id: ${AUTH_SERVER_KEYCLOAK_CLIENT_ID}
    client-secret: ${AUTH_SERVER_KEYCLOAK_CLIENT_SECRET}

logging:
  level:
    org:
      springframework:
        security: TRACE